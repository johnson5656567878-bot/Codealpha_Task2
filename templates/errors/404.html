{% extends 'base.html' %}
{% load static %}

{% block title %}Page Not Found | Nexus{% endblock %}
{% block right_sidebar %}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh; padding: 2rem;">
  <div class="text-center">
    <div class="mb-3" style="font-size: 5rem; font-weight: 900; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
      404
    </div>
    <h3 class="fw-bold mb-2" style="color: var(--text-primary);">Page Not Found</h3>
    <p class="text-muted mb-4" style="max-width: 420px; margin: 0 auto 1.5rem;">
      The page you requested doesn't exist, has been removed, or is temporarily unavailable.
    </p>
    <a href="{% url 'home' %}" class="btn btn-primary-gradient px-4 py-2">
      <i class="fa-solid fa-house me-2"></i> Back to Feed
    </a>
  </div>
</div>
{% endblock %}
