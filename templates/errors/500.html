{% extends 'base.html' %}
{% load static %}

{% block title %}Server Error | Nexus{% endblock %}
{% block right_sidebar %}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh; padding: 2rem;">
  <div class="text-center">
    <div class="mb-3 text-danger" style="font-size: 4rem;">
      <i class="fa-solid fa-server"></i>
    </div>
    <h3 class="fw-bold mb-2" style="color: var(--text-primary);">Something went wrong</h3>
    <p class="text-muted mb-4" style="max-width: 420px; margin: 0 auto 1.5rem;">
      An unexpected internal error occurred on our servers. Our team has been notified.
    </p>
    <a href="{% url 'home' %}" class="btn btn-outline-custom px-4 py-2">
      <i class="fa-solid fa-rotate-right me-2"></i> Try Again
    </a>
  </div>
</div>
{% endblock %}
