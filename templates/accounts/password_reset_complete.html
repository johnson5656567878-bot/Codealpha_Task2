{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete | Nexus{% endblock %}
{% block right_sidebar %}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 85vh; padding: 1.5rem;">
  <div class="card p-4 p-md-5 border-0 shadow-lg rounded-4 w-100 text-center" style="max-width: 440px; background-color: var(--bg-surface);">
    <div class="mb-3 text-success">
      <i class="fa-solid fa-circle-check fa-3x"></i>
    </div>
    <h4 class="fw-bold mb-2" style="color: var(--text-primary);">Password Changed</h4>
    <p class="text-muted small mb-4">Your password has been set successfully. You can now log into your Nexus account.</p>
    <a href="{% url 'login' %}" class="btn btn-primary-gradient w-100 py-2">Log In to Nexus</a>
  </div>
</div>
{% endblock %}
