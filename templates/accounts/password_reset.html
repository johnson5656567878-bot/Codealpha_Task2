{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password | Nexus{% endblock %}
{% block right_sidebar %}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 85vh; padding: 1.5rem;">
  <div class="card p-4 p-md-5 border-0 shadow-lg rounded-4 w-100" style="max-width: 440px; background-color: var(--bg-surface);">
    <div class="text-center mb-4">
      <div class="mb-2 text-primary">
        <i class="fa-solid fa-key fa-2x"></i>
      </div>
      <h4 class="fw-bold mb-1" style="color: var(--text-primary);">Reset Password</h4>
      <p class="text-muted small">Enter your account email to receive a password recovery link.</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-bold" style="color: var(--text-secondary);">Your Registered Email</label>
        <input type="email" name="email" class="form-control" placeholder="name@example.com" required style="background: var(--bg-subtle); color: var(--text-primary); border-color: var(--border-subtle);">
      </div>

      <button type="submit" class="btn btn-primary-gradient w-100 py-2 mt-2 fw-bold">
        Send Reset Link
      </button>
    </form>

    <div class="text-center mt-4 pt-2 border-top border-light-subtle">
      <a href="{% url 'login' %}" class="small text-decoration-none">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
